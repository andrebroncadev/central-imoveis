services:
  - type: web
    name: central-imoveis
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /login.php
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVER_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
